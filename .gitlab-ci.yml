image: obarun/base:latest

before_script:
  - pacman -Syu --noconfirm
  - pacman -S base-devel meson git --noconfirm

stages:
  - build
  - release
  - request

request:
  stage: request
  script:
  - meson setup build -D test=true -D with-pkgconfig=true
  - meson compile -C build
  - DESTDIR=gitlab-ci meson install -C build


  only:
  - merge_requests

build:
  stage: build
  script:
  - meson setup build -D test=true -D with-pkgconfig=true
  - meson compile -C build
  - meson test -C build --print-errorlogs
  - DESTDIR=gitlab-ci meson install -C build

  only:
    refs:
      - master

test-sanitizers:
  stage: build
  script:
  - meson setup build-asan -D test=true -D with-pkgconfig=true -D b_sanitize=address,undefined
  - meson compile -C build-asan
  - ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 meson test --print-errorlogs -C build-asan

  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

release:
  stage: release
  script:
  - meson setup build -D test=true -D with-pkgconfig=true
  - meson compile -C build
  - meson test -C build --print-errorlogs
  - DESTDIR=gitlab-ci meson install -C build

  only:
      refs:
        - tags