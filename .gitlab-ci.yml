image: obarun/base:latest

before_script:
  - pacman -Syu --noconfirm
  - pacman -S autoconf automake binutils bison file flex gcc gettext groff libtool m4 make patch pkgconf texinfo which git grep --noconfirm

stages:
  - build
  - release
  - request

request:
  stage: request
  script:
  - ./build_toolchain.sh "commit"
  - ./configure --prefix=/usr
  - make
  - make DESTDIR=gitlab-ci install

  only:
  - merge_requests

build:
  stage: build
  script:
  - ./build_toolchain.sh "commit"
  - ./configure --prefix=/usr
  - make
  - make check
  - make DESTDIR=gitlab-ci install

  only:
    refs:
      - master

release:
  stage: release
  script:
  - ./build_toolchain.sh
  - ./configure --bindir=/usr/bin --shebangdir=/usr/bin --with-lib=/usr/lib/skalibs --with-lib=/usr/lib/execline --with-lib=/usr/lib/s6 --with-lib=/usr/lib/oblibs
  - make
  - make check
  - make DESTDIR=gitlab-ci install

  only:
      refs:
        - tags